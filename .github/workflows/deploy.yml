name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  # Allow manual runs from the Actions tab
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the static site
        run: node scripts/build.mjs

      - name: Verify committed output matches the build
        run: |
          git diff --exit-code -- public/ || {
            echo "::error::public/ is not what the generators produce. Run 'npm run build' and commit the result."
            exit 1
          }

      - name: Check sitemap and internal links
        run: |
          node scripts/check-sitemap.mjs
          node scripts/check-links.mjs

      - name: Install wrangler
        run: npm install --no-save wrangler@^4

      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
